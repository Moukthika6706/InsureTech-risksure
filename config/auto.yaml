# Personal Auto (private car) — illustrative rates only, not a real tariff.
kind: product
code: auto
name: Personal Auto
version: "1.0"
description: Private car insurance — own damage, third-party liability and add-ons.
currency: INR
risk:
  method: ml_model          # gradient boosting claim-likelihood model
  model: auto_risk.joblib
min_premium: 2500

fields:
  - {name: driver_age, label: Driver age, type: int, min: 18, max: 80, default: 35, group: Driver}
  - {name: years_licensed, label: Years licensed, type: int, min: 0, max: 62, default: 10, group: Driver}
  - name: prior_claims_3y
    label: Claims in last 3 years
    type: int
    min: 0
    max: 10
    default: 0
    group: Driver
  - name: no_claim_bonus_pct
    label: No Claim Bonus (NCB)
    type: select
    options: [0, 20, 25, 35, 45, 50]
    default: 0
    help: Discount earned for consecutive claim-free years (Indian NCB slabs).
    group: Driver
  - name: city_tier
    label: City tier
    type: select
    options:
      - {value: 1, label: "Tier 1 metro (Mumbai, Delhi, Bengaluru...)"}
      - {value: 2, label: "Tier 2 city (Jaipur, Kochi, Indore...)"}
    default: 1
    group: Driver
  - name: vehicle_type
    label: Vehicle type
    type: select
    options: [hatchback, sedan, suv, mpv, ev, sports]
    default: hatchback
    group: Vehicle
  - {name: vehicle_age_years, label: Vehicle age (years), type: int, min: 0, max: 25, default: 3, group: Vehicle}
  - name: insured_declared_value_inr
    label: Insured Declared Value (IDV)
    type: int
    min: 50000
    max: 10000000
    default: 650000
    help: The car's current market value — the most the insurer pays if it is stolen or written off.
    group: Vehicle
  - {name: annual_km, label: Kilometres driven per year, type: int, min: 0, max: 100000, default: 11000, group: Vehicle}
  - name: parking
    label: Overnight parking
    type: select
    options: [garage, street]
    default: garage
    group: Vehicle
  - {name: anti_theft_device, label: ARAI-approved anti-theft device, type: bool, default: false, group: Vehicle}

# CALIBRATED on the synthetic sample (data/auto_applicants.csv) on 2026-10-28:
# coverage rates scaled x0.2941 vs original to target loss ratio 0.65.
# Illustrative only — not real actuarial pricing.
coverages:
  - code: third_party_liability
    name: Third-party liability
    description: Injury or damage you cause to others. Mandatory by law in India.
    mandatory: true
    basis: {type: flat}
    rate: 1000  # calibrated; original 3400
  - code: own_damage
    name: Own damage
    description: Damage to or theft of your own car, priced on its IDV.
    default: true
    basis: {type: percent_of, field: insured_declared_value_inr}
    rate: 0.5884  # calibrated; original 2
  - code: personal_accident
    name: Personal accident (owner-driver)
    description: Compulsory ₹15 lakh cover for death or disability of the owner-driver.
    mandatory: true
    basis: {type: flat}
    rate: 220.6  # calibrated; original 750
  - code: zero_depreciation
    name: Zero depreciation add-on
    description: Pays the full cost of replaced parts with no deduction for wear.
    default: false
    basis: {type: percent_of, field: insured_declared_value_inr}
    rate: 0.1177  # calibrated; original 0.4
  - code: roadside_assistance
    name: Roadside assistance
    description: Towing, flat tyre and battery help.
    default: false
    basis: {type: flat}
    rate: 147.1  # calibrated; original 500

# Rating factors: multipliers on the base premium. Bands are [upper_bound, multiplier];
# the first band whose upper bound is >= the value applies.
rating_factors:
  - name: driver_age
    label: Driver age
    field: driver_age
    type: bands
    bands: [[20, 1.50], [24, 1.30], [29, 1.10], [60, 1.00], [70, 1.15], [120, 1.30]]
  - name: city_tier
    label: City tier
    field: city_tier
    type: map
    values: {1: 1.10, 2: 1.00}
  - name: vehicle_type
    label: Vehicle type
    field: vehicle_type
    type: map
    values: {hatchback: 1.00, sedan: 1.05, suv: 1.10, mpv: 1.05, ev: 0.95, sports: 1.40}
  - name: vehicle_age
    label: Vehicle age
    field: vehicle_age_years
    type: bands
    bands: [[1, 1.00], [5, 1.05], [10, 1.10], [99, 1.20]]
  - name: annual_km
    label: Annual mileage
    field: annual_km
    type: bands
    bands: [[5000, 0.90], [12000, 1.00], [20000, 1.10], [1000000, 1.20]]
  - name: prior_claims
    label: Claims history
    field: prior_claims_3y
    type: bands
    bands: [[0, 1.00], [1, 1.15], [2, 1.35], [99, 1.60]]
  - name: parking
    label: Overnight parking
    field: parking
    type: map
    values: {garage: 0.95, street: 1.05}

# Modifiers: discounts/surcharges applied after rating.
modifiers:
  - name: ncb
    label: No Claim Bonus
    field: no_claim_bonus_pct
    type: percent_discount
  - name: anti_theft
    label: Anti-theft device discount
    field: anti_theft_device
    type: map
    values: {true: 0.975, false: 1.0}
