# Render Blueprint: creates the RiskSure API web service from this repo.
services:
  - type: web
    name: risksure-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.2
      # Set this in the Render dashboard to your Vercel URL, e.g. https://risksure.vercel.app
      - key: ALLOWED_ORIGINS
        sync: false
