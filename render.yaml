# Render Blueprint: creates the RiskSure API web service from this repo.
# Built with the Dockerfile at the repo root (the API needs config/, data/
# and models/ next to backend/).
services:
  - type: web
    name: risksure-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      # Free instances have no persistent disk: the SQLite file is wiped on
      # every deploy/restart, so re-create the 400-quote demo book on start.
      - key: SEED_DEMO_DATA
        value: "true"
      # Set this in the Render dashboard to your Vercel URL, e.g. https://risksure.vercel.app
      - key: ALLOWED_ORIGINS
        sync: false
      # Rule assistant: set the key as a secret in the Render dashboard (never in git).
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-opus-5-5
